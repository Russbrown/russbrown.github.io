---
layout: default
title: Russ Brown
---

<ul class="grid">
{% for post in site.posts %}
	{% if post.url %}
		<li class="grid__cell 1/3">
			<div class='post__summary post--{{ post.type | remove: " "}}'>
				<div class="post__type">{{ post.type }}</div>
				<a href="{{ post.url }}" class="post__title">{{ post.title }}</a>
				<div class="post__intro">{{ post.intro }}</div>
				<div class="post__date">{{ post.date | date_to_long_string }}</div>
			</div>
		</li>
	{% endif %}
{% endfor %}
</ul>
